<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>네크로맨서 키우기</title>
<style>
  :root { --wood:#2a2018; --wood2:#382a1e; --wood3:#4a3826; --gold:#c99a45; --gold2:#6e5228; --cream:#efe2c4; --muted:#a8977a; --red:#9e3a2a; --red2:#6a2218; --green:#5d7f36; --green2:#3c5420; --ink:#140f0b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0e0b08; color: var(--cream); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size: 13px; overflow: hidden; }
  #app { max-width: 480px; margin: 0 auto; height: 100%; height: 100dvh; display: flex; flex-direction: column; background: var(--ink); position: relative; }
  .frame { background: var(--wood); border: 2px solid var(--gold2); box-shadow: inset 0 0 0 1px #000, 0 0 0 1px #000; border-radius: 4px; }
  b, .t { text-shadow: 0 1px 0 #000; }
  /* 상단 재화 바 */
  #top { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 4px; padding: 5px 6px; background: linear-gradient(#2e2318, #221a12); border-bottom: 2px solid var(--gold2); }
  .pill { background: #15100b; border: 1px solid var(--gold2); border-radius: 3px; padding: 3px 6px; display: flex; flex-direction: column; line-height: 1.15; }
  .pill small { color: var(--muted); font-size: 10px; }
  .pill b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stage { flex: 1; display: flex; flex-direction: column; position: relative; min-height: 0; }
  #banner { margin: 5px 6px 0; padding: 4px 8px; display: flex; align-items: center; gap: 8px; }
  #banner .name { flex: 1; font-weight: bold; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segs { display: flex; gap: 1px; }
  .segs i { width: 4px; height: 8px; background: #15100b; border: 1px solid #000; }
  .segs i.on { background: var(--gold); }
  .segs i.boss { background: var(--red); }
  #action { position: relative; margin: 4px 6px 0; flex: 1 1 0; height: auto; min-height: 150px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; border: 2px solid var(--gold2); box-shadow: 0 0 0 1px #000; overflow: hidden; background: #000; }
  #cv { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #modeBtn { position: absolute; right: 6px; bottom: 6px; background: var(--wood2); color: var(--cream); border: 2px solid var(--gold); border-radius: 4px; padding: 5px 9px; font-size: 12px; font-weight: bold; box-shadow: 0 2px 0 #000; }
  #tierNav { position: absolute; left: 6px; top: 6px; display: flex; gap: 4px; align-items: center; }
  .navb { background: rgba(20,15,10,.85); color: var(--cream); border: 1px solid var(--gold2); border-radius: 3px; padding: 3px 8px; font-size: 12px; }
  .navb:disabled { opacity: .3; }
  #floats { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .fl { position: absolute; font-weight: bold; font-size: 12px; white-space: nowrap; text-shadow: 0 1px 0 #000, 0 0 3px #000; animation: rise 1.1s forwards; transform: translateX(-50%); }
  @keyframes rise { to { transform: translate(-50%, -26px); opacity: 0; } }
  #mid { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 6px 4px; }
  #homeSub { flex: 1 1 0; min-height: 0; margin: 0 6px 4px; display: flex; flex-direction: column; padding: 5px; }
  #homeSub .seg { margin: 0 0 5px; }
  #hsBody { flex: 1; overflow-y: auto; }
  .seg.s4 { grid-template-columns: repeat(4, 1fr); }
  .seg.s2 { grid-template-columns: repeat(2, 1fr); }
  .seg.s1 { grid-template-columns: 1fr; }
  .slot .pg { width: 70%; height: 4px; background: #120d09; border: 1px solid #000; margin-top: 2px; }
  .slot .pg i { display: block; height: 100%; background: #9b7ac7; }
  .slot.run { border-color: #c79bff; background: rgba(90,60,130,.55); }
  #midL, #midR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--muted); }
  #midR { align-items: flex-end; text-align: right; }
  #bigBtn { flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--gold); background: radial-gradient(circle at 45% 38%, #5a3f7a, #241731 72%); color: var(--cream); font-size: 14px; font-weight: bold; box-shadow: 0 3px 0 #000, inset 0 0 0 2px #000; touch-action: manipulation; user-select: none; text-shadow: 0 1px 0 #000; line-height: 1.2; }
  #bigBtn.dig { background: radial-gradient(circle at 45% 38%, #6e5232, #2d2014 72%); }
  #bigBtn:active { transform: translateY(2px) scale(.97); box-shadow: 0 1px 0 #000, inset 0 0 0 2px #000; }
  .chip { background: #15100b; color: var(--cream); border: 1px solid var(--gold2); border-radius: 3px; padding: 3px 6px; font-size: 11px; white-space: nowrap; }
  .chip.on { border-color: var(--gold); background: var(--wood3); }
  .chip:disabled { opacity: .35; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  #log { position: absolute; left: 90px; right: 92px; bottom: 6px; padding: 3px 7px; font-size: 11px; color: #e8d9b0; background: rgba(20,14,9,.78); border: 1px solid var(--gold2); border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  nav { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); background: #1a130d; border-top: 2px solid var(--gold2); }
  nav button { background: var(--wood2); color: var(--muted); border: 2px solid var(--gold2); border-radius: 4px; padding: 8px 0; font-size: 13px; font-weight: bold; box-shadow: 0 2px 0 #000; }
  nav button.on { color: #fff3d0; border-color: var(--gold); background: #5a4128; }
  /* 패널 */
  #panel { position: absolute; inset: 0; background: var(--ink); display: flex; flex-direction: column; z-index: 4; }
  #panel[hidden] { display: none; }
  .phead { display: none !important; }
  .phead_old { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; background: linear-gradient(#3a2c1e, #2a2016); border-bottom: 2px solid var(--gold2); }
  .phead b { font-size: 15px; }
  #pbody { flex: 1; overflow-y: auto; padding: 8px; }
  #pfoot { padding: 6px 8px; border-top: 2px solid var(--gold2); background: #1a130d; }
  #pfoot:empty { display: none; }
  .card { background: var(--wood); border: 2px solid var(--gold2); box-shadow: inset 0 0 0 1px #000; border-radius: 4px; padding: 8px; margin-bottom: 7px; }
  .card h4 { margin: 0 0 6px; font-size: 13px; color: #f3dca0; text-shadow: 0 1px 0 #000; }
  .row { display: flex; align-items: center; gap: 8px; }
  .sp { justify-content: space-between; }
  .mut { color: var(--muted); font-size: 11px; }
  .btn { background: var(--red); color: #fff2dc; border: 2px solid #000; border-bottom-width: 3px; border-radius: 4px; padding: 6px 10px; font-size: 12px; font-weight: bold; text-shadow: 0 1px 0 #000; white-space: nowrap; }
  .btn.g { background: var(--green); }
  .btn.b { background: #3f5f7f; }
  .btn.dk { background: var(--wood3); }
  .btn:disabled { background: #3a332b; color: #7a7060; }
  .btn.wide { width: 100%; padding: 10px; font-size: 14px; }
  .lrow { display: flex; align-items: center; gap: 8px; background: #1c150f; border: 1px solid #000; border-radius: 3px; padding: 5px 6px; margin-bottom: 4px; }
  .lrow .ico { width: 30px; height: 30px; flex: 0 0 30px; background: #120d09; border: 1px solid var(--gold2); border-radius: 3px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .lrow .ico img { image-rendering: pixelated; width: 40px; height: 40px; margin-top: 4px; }
  .lrow .info { flex: 1; min-width: 0; }
  .lrow .info b { font-size: 12px; }
  .grade { display: inline-block; padding: 0 4px; border-radius: 2px; font-size: 10px; font-weight: bold; color: #111; margin-right: 3px; }
  .circle { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 8px; background: radial-gradient(circle, #2a1d33 0%, #140f0b 75%); border: 2px solid #5a3f7a; border-radius: 6px; }
  .slot { aspect-ratio: 1; border: 1px dashed #5a4a66; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; color: #6a5a76; background: rgba(0,0,0,.3); }
  .slot.full { border-style: solid; border-color: #9b7ac7; color: var(--cream); background: rgba(60,40,80,.5); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin: 7px 0; }
  .seg button { background: var(--wood2); color: var(--muted); border: 2px solid var(--gold2); border-radius: 4px; padding: 6px 0; font-weight: bold; font-size: 12px; }
  .seg button.on { color: #fff3d0; border-color: var(--gold); background: #5a4128; }
  .bar { height: 7px; background: #120d09; border: 1px solid #000; border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--gold); }
  .modalBg { position: fixed; inset: 0; background: rgba(0,0,0,.78); display: flex; align-items: center; justify-content: center; z-index: 30; }
  .modal { background: var(--wood); border: 2px solid var(--gold); box-shadow: 0 0 0 2px #000; border-radius: 6px; padding: 14px; width: min(90vw, 390px); max-height: 82vh; overflow-y: auto; line-height: 1.55; }
  .modal h3 { margin: 0 0 8px; color: #f3dca0; text-shadow: 0 1px 0 #000; }
  .modal input { width: 100%; margin-top: 10px; padding: 9px; border-radius: 4px; border: 2px solid var(--gold2); background: #120d09; color: #fff; font-size: 15px; }
  .story { color: #dccba6; font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%); max-width: 88vw; background: rgba(20,14,9,.95); color: var(--cream); border: 2px solid var(--gold2); border-radius: 6px; padding: 7px 12px; font-size: 12px; z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; text-align: center; }
  #toast.on { opacity: 1; }
  #tutBub { position: fixed; left: 50%; top: 58px; z-index: 36 !important; transform: translateX(-50%); width: min(92vw, 400px); box-sizing: border-box; background: #2a1d3a; color: #f2e6ff; border: 2px solid #9b6ad6; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: bold; z-index: 35; display: none; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.6); pointer-events: none; }
  #tutBub.on { display: block; }
  .tutHi { position: relative; z-index: 5; outline: 3px solid #c9a0ff !important; outline-offset: 2px; animation: tutPulse 1s ease-in-out infinite; }
  @keyframes tutPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(201,160,255,.8); } 50% { box-shadow: 0 0 0 7px rgba(201,160,255,0); } }
  #tutSkip { display: none; position: fixed; right: 10px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 37; background: rgba(20,14,30,.88); color: #d9c8f5; border: 1px solid #6c4fa0; border-radius: 999px; padding: 6px 12px; font: 600 12px inherit; font-family: inherit; }
  #tutSkip.on { display: block; }
  #tutDim { display: none; }
  #tutDim.on { display: block; }
  #tutDim .td { position: fixed; background: rgba(0,0,0,.68); z-index: 32; }
  #tutRing { position: fixed; z-index: 33; pointer-events: none; border: 3px solid #c9a0ff; border-radius: 8px; box-sizing: border-box; animation: tutRing 1s ease-in-out infinite; }
  @keyframes tutRing { 0%, 100% { box-shadow: 0 0 6px 2px rgba(201,160,255,.9), inset 0 0 6px rgba(201,160,255,.6); } 50% { box-shadow: 0 0 18px 8px rgba(201,160,255,.35), inset 0 0 14px rgba(201,160,255,.3); } }
  #tapHint { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); font-size: 11px; color: #efe2c4; background: rgba(0,0,0,.45); border-radius: 10px; padding: 2px 9px; pointer-events: none; opacity: .8; white-space: nowrap; }
  #infoBox { position: absolute; left: 6px; bottom: 6px; width: 78px; box-sizing: border-box; padding: 3px 5px; font-size: 11px; color: #e8d9b0; background: rgba(20,14,9,.85); border: 1px solid var(--gold2); border-radius: 3px; text-align: center; pointer-events: none; white-space: nowrap; }
  #infoBox b { color: var(--cream); }
  #homeSub { margin-top: 4px !important; }

  /* ===== v9 스킨: 흑요석 + 보랏빛 사령술 + 금색 실선 ===== */
  :root { --bg:#0c0a0f; --pan:#17131d; --pan2:#1f1a27; --line:rgba(214,178,110,.28); --line2:rgba(214,178,110,.55); --gold:#d6b26e; --gold2:#8a6d3a; --cream:#efe6d6; --muted:#8f8698; --vio:#8a5cd6; --vio2:#5b3a99; --vioG:rgba(150,100,230,.35); --red:#b8433a; --green:#4f8f5a; --ink:#0c0a0f; }
  html, body { background: #060508; font-family: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; letter-spacing: -.1px; }
  #app { background: radial-gradient(120% 60% at 50% 0%, #1c1626 0%, var(--bg) 60%); }
  b, .t { text-shadow: none; }
  .frame { background: linear-gradient(180deg, var(--pan2), var(--pan)); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04); }
  /* 상단 재화 */
  #top { gap: 5px; padding: 7px 8px 6px; background: linear-gradient(180deg, #1a1521, #120f17); border-bottom: 1px solid var(--line); }
  .pill { background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 9px; padding: 4px 8px; }
  .pill small { color: var(--muted); font-size: 10px; letter-spacing: .2px; }
  .pill b { font-size: 14px; font-weight: 700; color: var(--cream); font-variant-numeric: tabular-nums; }
  .pill.cls { background: linear-gradient(135deg, rgba(138,92,214,.25), rgba(138,92,214,.06)); border-color: rgba(160,120,230,.5); }
  .pill.cls small { color: #b9a3e0; }
  .pill .ic { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  /* 배너 */
  #banner { margin: 7px 8px 0; padding: 6px 10px; border-radius: 9px; }
  #banner .name { font-size: 12.5px; color: var(--cream); }
  .segs { gap: 2px; }
  .segs i { width: 5px; height: 9px; border: 0; border-radius: 2px; background: rgba(255,255,255,.08); }
  .segs i.on { background: var(--gold); box-shadow: 0 0 4px rgba(214,178,110,.6); }
  .segs i.boss { background: rgba(184,67,58,.45); }
  .segs i.boss.on { background: #e0584a; box-shadow: 0 0 5px rgba(224,88,74,.7); }
  /* 필드 */
  #action { margin: 6px 8px 0; border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 8px 22px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.6); }
  #modeBtn { right: 8px; bottom: 8px; background: linear-gradient(180deg, #2a2234, #1a1522); border: 1px solid var(--line2); border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--cream); box-shadow: 0 3px 10px rgba(0,0,0,.5); }
  #modeBtn:disabled { opacity: .55; }
  .navb { background: rgba(12,10,15,.7); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
  #log { left: 92px; right: 102px; bottom: 8px; padding: 5px 10px; border-radius: 999px; background: rgba(12,10,15,.72); border: 1px solid rgba(255,255,255,.08); color: #ddd2bf; backdrop-filter: blur(3px); }
  #infoBox { left: 8px; bottom: 8px; width: 80px; padding: 5px 6px; border-radius: 999px; background: rgba(12,10,15,.72); border: 1px solid rgba(255,255,255,.08); color: var(--muted); }
  #tapHint { top: 8px; padding: 3px 11px; border-radius: 999px; background: rgba(12,10,15,.55); border: 1px solid rgba(255,255,255,.07); color: #cfc3ad; animation: hintPulse 2.4s ease-in-out infinite; }
  @keyframes hintPulse { 50% { opacity: .45; } }
  /* 하단 탭 영역 */
  #homeSub { margin: 6px 8px 6px; padding: 7px; border-radius: 12px; }
  .seg { gap: 4px; background: rgba(0,0,0,.25); padding: 3px; border-radius: 10px; border: 1px solid rgba(255,255,255,.04); }
  .seg button { background: transparent; border: 0; border-radius: 8px; color: var(--muted); padding: 7px 0; font-size: 12.5px; }
  .seg button.on { background: linear-gradient(180deg, #3a2e4c, #2a2138); color: #fff; box-shadow: inset 0 0 0 1px rgba(170,130,240,.45), 0 2px 6px rgba(0,0,0,.4); }
  /* 카드 · 행 */
  .card { background: linear-gradient(180deg, var(--pan2), var(--pan)); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.35); padding: 10px; margin-bottom: 8px; }
  .card h4 { color: var(--gold); font-size: 13px; letter-spacing: .3px; text-shadow: none; }
  .lrow { background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06); border-radius: 10px; padding: 6px 8px; margin-bottom: 5px; }
  .lrow .info b { font-size: 12.5px; color: var(--cream); }
  .lrow .ico { width: 34px; height: 34px; flex: 0 0 34px; background: radial-gradient(circle at 50% 70%, #2a2236, #120f17); border: 1px solid var(--line); border-radius: 8px; }
  .lrow .ico img { width: 40px; height: 40px; margin-top: 2px; }
  .lrow .ico.big img { width: 34px; height: 34px; margin-top: 0; }
  .mut { color: var(--muted); }
  .grade { border-radius: 999px; padding: 1px 6px; font-size: 10px; }
  /* 버튼 */
  .btn { background: linear-gradient(180deg, #c9503f, #9a3529); color: #fff; border: 0; border-radius: 9px; padding: 7px 12px; font-size: 12px; text-shadow: none; box-shadow: 0 2px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18); }
  .btn.g { background: linear-gradient(180deg, #8c62d8, #5e3aa0); }
  .btn.b { background: linear-gradient(180deg, #4f7fb0, #355a85); }
  .btn.dk { background: linear-gradient(180deg, #2c2536, #1f1a27); color: #d8cde6; box-shadow: inset 0 0 0 1px rgba(255,255,255,.09); }
  .btn:disabled { background: #221d29; color: #6c6476; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
  .btn:not(:disabled):active { transform: translateY(1px); }
  .btn.wide { border-radius: 12px; padding: 12px; font-size: 14px; background: linear-gradient(180deg, #9a6be6, #6440ad); box-shadow: 0 4px 14px rgba(120,70,210,.35), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.wide:disabled { background: #221d29; box-shadow: none; }
  .chip { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 999px; padding: 4px 9px; color: #d8cde6; }
  .chip.on { background: linear-gradient(180deg, #3a2e4c, #2a2138); border-color: rgba(170,130,240,.6); color: #fff; }
  /* 의식진 */
  .circle { background: radial-gradient(circle at 50% 50%, rgba(120,70,200,.22), rgba(12,10,15,.0) 70%), #110e16; border: 1px solid rgba(150,100,230,.4); border-radius: 12px; box-shadow: inset 0 0 30px rgba(120,70,200,.15); }
  .slot { border-color: rgba(150,110,210,.35); color: #5d5170; }
  .slot.full { border-color: #a37ae6; background: radial-gradient(circle, rgba(140,90,220,.35), rgba(60,40,90,.5)); box-shadow: 0 0 8px rgba(150,100,230,.35); }
  .slot.run { border-color: #c9a0ff; background: radial-gradient(circle, rgba(170,120,255,.5), rgba(80,50,130,.6)); box-shadow: 0 0 12px rgba(170,120,255,.55); animation: slotGlow 1.2s ease-in-out infinite; }
  @keyframes slotGlow { 50% { box-shadow: 0 0 4px rgba(170,120,255,.25); } }
  .slot .pg { border: 0; border-radius: 99px; background: rgba(0,0,0,.5); }
  .slot .pg i { border-radius: 99px; background: linear-gradient(90deg, #b08cff, #e0ccff); }
  /* 패널 */
  #panel { background: var(--bg); }
  #pbody { padding: 10px 8px; }
  #pfoot { border-top: 1px solid var(--line); background: linear-gradient(180deg, #15111b, #0e0b12); padding: 8px; }
  /* 하단 메뉴 */
  nav { gap: 2px; padding: 5px 6px calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, #15111b, #0c0a0f); border-top: 1px solid var(--line); }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; background: transparent; border: 0; box-shadow: none; border-radius: 10px; padding: 6px 0 5px; color: #7d748a; font-size: 11px; font-weight: 600; }
  nav button svg { width: 21px; height: 21px; fill: currentColor; }
  nav button.on { color: var(--gold); background: radial-gradient(80% 90% at 50% 100%, rgba(214,178,110,.18), transparent 70%); }
  nav button.on svg { filter: drop-shadow(0 0 4px rgba(214,178,110,.6)); }
  /* 모달 */
  .modalBg { background: rgba(6,5,9,.78); backdrop-filter: blur(3px); }
  .modal { background: linear-gradient(180deg, #211b2b, #15111b); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.6); padding: 18px; }
  .modal h3 { color: var(--gold); letter-spacing: .3px; text-shadow: none; }

  body.instOn #nav, body.instOn #top { pointer-events: none; }
  body.instOn #banner { padding-top: calc(10px + env(safe-area-inset-top)); }
  body.instOn #instBar { top: calc(9vh + env(safe-area-inset-top)); left: 7%; right: 7%; text-align: center; }
  body.instOn #banner, body.instOn #infoBox, body.instOn #log, body.instOn #autoBox, body.instOn #modeBtn { display: none !important; }
  .ibFloor { font-size: 13px; font-weight: 700; color: #ff5a4a; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  body.instOn .ibName { font-size: 26px; font-weight: 900; color: #ff3a2a; letter-spacing: 3px; margin: 4px 0 12px; text-shadow: 0 0 14px rgba(255,60,20,.6), 0 2px 0 #000; }
  body.instOn .ibBar { height: 16px; border-radius: 3px; } body.instOn .ibBar b { font-size: 10.5px; }
  .ibT { margin-top: 12px; font-size: 30px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 6px #000; }
  .ibT.low { color: #ff5a4a; animation: lavaF .6s infinite; }
  body.instOn #infoBox { bottom: calc(14px + env(safe-area-inset-bottom)); }
  body.instOn #log { bottom: calc(14px + env(safe-area-inset-bottom)); }
  #instRes { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; background: rgba(0,0,0,.35); }
  #instRes:empty { display: none; }
  .irWrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; font-family: inherit; color: inherit; cursor: pointer; }
  .irBox { font-family: inherit; color: inherit; display: block; text-align: center; padding: 16px 28px; border-radius: 16px; background: rgba(10,4,4,.72); border: 1px solid rgba(255,140,90,.5); animation: fxIn .35s ease-out; }
  .irBox b { display: block; font-size: 30px; letter-spacing: 4px; color: #ffd0a0; text-shadow: 0 0 14px rgba(255,120,40,.8); }
  .irBox.lose b { color: #ff6a5a; text-shadow: 0 0 12px rgba(255,60,40,.5); } .irBox small { display: block; font-size: 12px; color: #e8d0c0; margin-top: 4px; } .irBox em { display: block; font-style: normal; font-size: 11px; color: #a89aa8; margin-top: 10px; animation: lavaF 1.4s infinite; }
  .tix { float: right; font-size: 11px; font-weight: 600; color: #ffb09a; } .tix b { color: #fff; }
  .gch { display: flex; align-items: center; gap: 10px; justify-content: space-between; background: linear-gradient(135deg, rgba(214,178,110,.12), rgba(120,70,220,.08)); border-color: rgba(214,178,110,.3); }
  .btn.gold { background: linear-gradient(180deg, #e0b450, #a8782a); color: #1a1208; } .btn.gold:disabled { background: #221d29; color: #6c6476; }
  .gres { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; } .gres img { width: 96px; height: 96px; image-rendering: pixelated; } .gres b { font-size: 16px; color: var(--gold); } .gres span { color: #ffd870; letter-spacing: 2px; }

    소인은 무덤을 계속 파 두겠사옵니다. 도굴 화면에서 소인에게 일을 더 가르쳐 주시면 의식과 소환도 알아서 하겠사옵니다."</div><div class="mut" style="margin-top:6px">튜토리얼 끝 · 이제 자유롭게 키워보세요</div>`, [{ label: "좋다", fn: () => { S.tut = 99; B.started = false; save(); } }]);
}
function butler() {
  modal(`<h3>첫 번째 혼백</h3><div class="story">흙을 털고 일어난 해골이 뼈마디를 딱딱 맞추더니, 정중하게 허리를 숙였다.<br><br>
    "…전하? 오오, ${S.prince} 전하! 왕실 집사이옵니다. 하필 첫 소환이 이 늙은 뼈다귀라 송구하옵니다. 허리는… 원래 없사오니 걱정 마시옵소서."</div>`, [{ label: "…반갑다" }]);
}
// 새 버전 알림: 배포 주소(같은 폴더)의 version.txt가 지금 빌드와 다르면 새로고침 버튼을 띄움
const BUILD = "20261123154113";
function checkVersion() {
  if (BUILD.startsWith("__") || location.protocol === "file:") return;
  fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
    v = v.trim(); if (!v || v === BUILD || document.getElementById("newVer")) return;
    // 방금 이 버전으로 새로고침했는데 아직 옛 파일이 왔다면(서버 반영 지연) 3분 동안은 다시 묻지 않음
    try { const t = (sessionStorage.getItem("necroTry") || "").split("|"); if (t[0] === v && Date.now() - +t[1] < 180000) return; } catch (e) {}
    // 새 게임 파일이 실제로 받아지는지 먼저 확인(아직 옛 파일이면 버튼을 띄우지 않고 다음 확인 때 다시)
    return fetch(location.pathname + "?v=" + encodeURIComponent(v), { cache: "reload" }).then(r => r.ok ? r.text() : "").then(txt => {
    if (!txt.includes('BUILD = "' + v + '"') || document.getElementById("newVer")) return;
    const b = document.createElement("button"); b.id = "newVer"; b.textContent = "새 버전이 나왔어요 · 눌러서 새로고침";
    b.onclick = () => { try { save(); sessionStorage.setItem("necroTry", v + "|" + Date.now()); } catch (e) {} location.replace(location.pathname + "?v=" + encodeURIComponent(v)); };   // 주소 뒤에 버전을 붙여 브라우저 캐시(옛 파일) 우회
    document.body.appendChild(b);
  }); }).catch(() => {});
}
setInterval(checkVersion, 60000); setTimeout(checkVersion, 5000);
function init() {
  for (const k in SPRITES) { const im = new Image(); im.src = SPRITES[k].src; IMG[k] = im; }
  cv = $("cv"); ctx = cv.getContext("2d"); resize(); window.addEventListener("resize", resize);
  const had = load(); if (!had) S = newState();
  B.prinHp = princeMaxHp(); hseg = S.mode === "battle" ? "army" : "worker";
  $("nav").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) sfx("tab"); if (b) setTab(b.dataset.tab === tab && tab !== "home" ? "home" : b.dataset.tab); });
  window.addEventListener("pointerdown", () => SFX.unlock(), { capture: true });
  // 강화 버튼 꾹 누르기: 0.4초 뒤부터 연속 구매(점점 빨라짐). 손을 떼면 멈춤
  let holdT = null, holdN = 0, held = false;
  const stopHold = () => { if (holdT) { clearTimeout(holdT); holdT = null; } };
  $("app").addEventListener("pointerdown", e => {
    const el = e.target.closest('[data-act="up2"],[data-act="cup"],[data-act="trainUp"]'); if (!el || el.disabled) return;
    held = false; holdN = 0; stopHold();
    const rep = () => { held = true; holdN++; onAct(el); const lbl = $("toast"); if (lbl) { lbl.textContent = `연속 강화 ${holdN}회`; lbl.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => lbl.classList.remove("on"), 900); } holdT = setTimeout(rep, Math.max(25, 110 - holdN * 4)); };
    holdT = setTimeout(rep, 400);
  });
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) window.addEventListener(ev, () => { stopHold(); if (held) setTimeout(() => { render(true); }, 80); });
  $("app").addEventListener("click", e => { if (held) { held = false; e.stopPropagation(); return; } }, true);
  $("app").addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (el && !el.disabled) { if (!["rank", "gacha", "sfx", "extract"].includes(el.dataset.act)) sfx("tap"); onAct(el); } });
  for (const id of ["pbody", "hsBody"]) $(id).addEventListener("pointerdown", () => { pressing = true; });
  window.addEventListener("pointerup", () => setTimeout(() => { pressing = false; }, 60));
  window.addEventListener("pointercancel", () => { pressing = false; });
  $("action").addEventListener("pointerdown", e => {   // 전투 화면 터치 = 소환, 도굴 화면 터치 = 땅 파헤치기
    if (e.target.closest("button")) return;
    e.preventDefault();
    if (S.mode === "battle") { if (!summon()) log(!S.army.length ? "소환할 언데드가 없어요. 군단 탭에서 혼백을 주입하세요." : fieldPop() >= cmdMax() ? `통솔력이 가득 찼어요 (${fieldPop()}/${cmdMax()})` : "잠시 후 다시 소환할 수 있어요"); }
    else { const c = digHit(tapDmg()); sfx(c && !c.full ? "corpse" : "dig"); digPose = 0.12; addFx(graveX() - 12, groundY() - 4, "#6b4a2e", 8); if (c && !c.full) floatText(graveX(), groundY() - 118, `${GRADES[c.grade].n} ${TYPES[c.type].n}`, GRADES[c.grade].c); }
  });
  if (S.flags.capRefund) setTimeout(() => { const r = S.flags.capRefund; delete S.flags.capRefund; save(); const show = () => modal(`<h3>강화 상한이 생겼어요</h3><div class="story">혼백·동료마다 강화 최대 레벨이 생겼어요. 높은 혼백일수록 최대 레벨이 높아서, 최대에 닿으면 다음 혼백으로 갈아타면 돼요.<br><br>상한을 넘었던 강화는 상한으로 맞추고, 그만큼 쓴 마력 <b style="color:#c9a8ff">${fmt(r)}</b>을 돌려드렸어요.</div>`, [{ label: "확인" }]); if ($("modalRoot").firstChild) setTimeout(show, 4000); else show(); }, 1200);
  if (!had || !S.prince) intro();
  else {
    const away = inTut() ? 0 : (Date.now() - S.last) / 1000;
    if (away > 10) { const r = simulate(away); modal(`<h3>돌아오셨군요, ${S.prince} 전하</h3>${Math.floor(r.sec / 60)}분 동안 일꾼과 의식진이 일했습니다.<div style="margin-top:6px">시체 ${r.corpses >= 0 ? "+" : ""}${r.corpses} · 군단 +${r.army} · 마법 수련 마력 ${r.mana >= 0 ? "+" : ""}${fmt(r.mana)}</div><div class="mut">전투는 화면을 보고 있을 때만 진행 · 최대 8시간</div>`, [{ label: "확인" }]); }
  }
  let prev = performance.now();
  setInterval(() => {
    const now = performance.now(), dt = (now - prev) / 1000; prev = now;
    if (dt > 2) { if (!inTut()) simulate(dt); } else { tick(dt, false); if (S.mode === "battle" && (!inTut() || S.tut === 7 || S.tut === 8)) battleTick(dt); }
    render(false); tutUpdate();
    if (pendingButler && !$("modalRoot").firstChild) { pendingButler = false; butler(); }
  }, 50);
  let pf = performance.now();
  const loop = now => { const dt = Math.min(0.1, (now - pf) / 1000); pf = now; if (tab === "home") { draw(dt); liveTrain(); } else liveTix(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  setInterval(save, 5000);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
  window.addEventListener("pagehide", save);
  setTab("home");
}
init();

</script>
